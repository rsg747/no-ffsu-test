<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style></head><body>
<title>N&amp;O FFSU Run-and-Grade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: an IOS clipboard — sticky teal N&O header, step tabs, then a two-pane run view (event list | event card). Touch-sized targets for iPad use at the instructor station. */
:root{
  --bg:#edf1f0; --panel:#ffffff; --panel2:#f5f8f7; --ink:#152120; --muted:#5b6a68; --line:#d2dbd9;
  --brand:#0c4a4f; --brand2:#12646a; --on-brand:#ffffff; --signal:#de7419; --signal-ink:#ffffff;
  --ok:#21784a; --okbg:#e3f3ea; --warn:#9a6200; --warnbg:#fdf1d8; --bad:#b0261d; --badbg:#fbe9e7;
  --info:#355d8c; --infobg:#e6eef8; --mute:#6c7776; --mutebg:#e9eded; --aqp:#b58a12; --aqpbg:#fbf3dc;
  --focus:#2f6fdb;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1415; --panel:#131f20; --panel2:#182728; --ink:#e2ebea; --muted:#93a4a1; --line:#273839;
    --brand:#0b3b3f; --brand2:#11555a; --signal:#f08f3a; --signal-ink:#1a1206;
    --ok:#5fcf8f; --okbg:#143223; --warn:#f0c45a; --warnbg:#382c10; --bad:#ff8a80; --badbg:#3a1a18;
    --info:#9cbbe6; --infobg:#18263a; --mute:#9aa6a4; --mutebg:#1e2a2b; --aqp:#e4c15a; --aqpbg:#33290d; --focus:#7aa7ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1415; --panel:#131f20; --panel2:#182728; --ink:#e2ebea; --muted:#93a4a1; --line:#273839;
  --brand:#0b3b3f; --brand2:#11555a; --signal:#f08f3a; --signal-ink:#1a1206;
  --ok:#5fcf8f; --okbg:#143223; --warn:#f0c45a; --warnbg:#382c10; --bad:#ff8a80; --badbg:#3a1a18;
  --info:#9cbbe6; --infobg:#18263a; --mute:#9aa6a4; --mutebg:#1e2a2b; --aqp:#e4c15a; --aqpbg:#33290d; --focus:#7aa7ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3,h4,h5{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:.2px;text-wrap:balance}
h2{font-size:30px;line-height:1.1}
h3{font-size:22px;margin:26px 0 10px}
h4{font-size:19px;margin:0 0 8px}
h5{font-size:16px;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px}
.eyebrow{display:block;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.grow{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:16px}
.row.between{justify-content:space-between;margin-top:14px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1240px;margin:0 auto}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand);color:var(--on-brand);border-bottom:4px solid var(--signal)}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.stamp{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;padding:7px 10px 5px;border:2.5px solid var(--on-brand);border-radius:6px;letter-spacing:.5px;background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.ttl h1{font-size:26px;line-height:1}
.ffsu{color:var(--signal);letter-spacing:.5px}
.ttl .eyebrow{color:var(--on-brand);opacity:.75;font-size:11px}
.cur{display:flex;flex-direction:column;line-height:1.15;text-align:right}
.cur b{font-family:var(--f-display);font-size:20px}
.cur span{font-size:13px;opacity:.85}
.mode{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.45)}
.mode.aqp{background:var(--aqp);border-color:var(--aqp);color:#1d1606}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.pill.ok::before{content:"● ";color:#7fe0a8}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.demo{background:var(--signal);color:var(--signal-ink);font-weight:700}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--on-brand);border-radius:6px;width:38px;height:38px;cursor:pointer;font-size:18px}
nav.steps{display:flex;gap:4px;overflow-x:auto;padding-block:0}
nav.steps button{background:none;border:0;color:var(--on-brand);opacity:.72;padding:10px 14px 9px;font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.3px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.steps button.on{opacity:1;border-bottom-color:var(--signal)}
nav.steps button:disabled{opacity:.3;cursor:not-allowed}
main{padding-block:22px 80px}

/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 15px;cursor:pointer;min-height:42px;font-weight:600}
.btn:hover{border-color:var(--brand2)}
.btn.primary{background:var(--brand2);border-color:var(--brand2);color:var(--on-brand)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.btn.small{min-height:34px;padding:4px 11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)}
.chip.info{background:var(--infobg);color:var(--info)} .chip.mute{background:var(--mutebg);color:var(--mute)} .chip.open{background:var(--infobg);color:var(--info)}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
label.f.wide{grid-column:1/-1;margin-top:12px}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel);font-weight:400;font-size:16px;color:var(--ink);width:100%;min-height:42px}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.g2.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:16px;align-items:start}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;min-height:42px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand2);color:var(--on-brand)}
.seg button.on.aqp{background:var(--aqp);color:#1d1606}
.seg small{display:block;font-weight:400;font-size:12px;opacity:.85}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:calc(100% - 32px)}
.mono{font-family:var(--f-mono);font-size:13px}
pre.mono{white-space:pre-wrap;margin:8px 0 0}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:22px;color:var(--muted)}
details.ref{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.ref summary{padding:12px 16px;cursor:pointer;font-weight:700}
details.ref>div{padding:0 16px 14px}
details.ref ul{margin:0;padding-left:20px}
.tbl{border-collapse:collapse;width:100%}
.tbl th,.tbl td{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;font-size:15px}
.tbl th{font-weight:700;width:34%}
.scroll{overflow-x:auto;margin-top:12px}

/* home */
.intro{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.lede{max-width:66ch;color:var(--muted);margin:8px 0 0}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:110px 1fr auto auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.scode{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--brand2)}
.smain{display:flex;flex-direction:column;min-width:0}
.sact{display:flex;gap:6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.lcard .btn{margin-top:auto;align-self:flex-start}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lcode{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.lname{margin:0;font-weight:600}
.lcard p{margin:0}
.lcard.recommend{border-top:4px solid var(--warn)} .lcard.spot{border-top:4px solid var(--info)} .lcard.training{border-top:4px solid var(--brand2)}
.srcnote{margin-top:18px}

/* brief */
.bhead{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.sum{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:12px 0 0;list-style:none}
.sum li{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:14px}
.clock .big{font-family:var(--f-mono);font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.bar{height:6px;background:var(--mutebg);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar span{display:block;height:100%;background:var(--signal)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;align-items:start}
.cnt{float:right;font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600}
ul.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cb{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:6px 4px;cursor:pointer;border-radius:6px;font-size:15px}
.cb:hover{background:var(--panel2)}
.cb .box{flex:none;width:20px;height:20px;border:2px solid var(--line);border-radius:5px;margin-top:1px;display:grid;place-items:center}
.cb.on .box{background:var(--ok);border-color:var(--ok)}
.cb.on .box::after{content:"";width:9px;height:5px;border:2.5px solid var(--panel);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cb.on>span:last-child{color:var(--muted)}
.topics .refs{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tag{font-size:11px;font-weight:700;color:var(--info);background:var(--infobg);border-radius:4px;padding:1px 6px;margin-left:4px}
.ofps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.ofp{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--brand2);border-radius:8px;padding:14px}
.ofp-h{font-family:var(--f-display);font-size:20px;font-weight:700;margin-bottom:8px}
.ofp dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:14px}
.ofp dt{color:var(--muted);font-weight:600}
.ofp dd{margin:0;font-family:var(--f-mono);font-size:13px}
.wx{margin:10px 0 0;line-height:1.5}

/* run */
.runbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.seg.half button{text-align:left}
.simclock{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 8px 6px 12px}
.simclock b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.runwrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.evlist{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px);max-height:calc(100vh - 140px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.evi{display:grid;grid-template-columns:26px 1fr 12px;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 10px;cursor:pointer;font-size:15px;line-height:1.25}
.evi:last-child{border-bottom:0}
.evi.on{background:var(--panel2);box-shadow:inset 4px 0 0 var(--signal)}
.evi .n{font-family:var(--f-display);font-size:20px;color:var(--muted);text-align:center}
.evi .ph{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)} .dot.warn{background:var(--warn);border-color:var(--warn)} .dot.bad{background:var(--bad);border-color:var(--bad)}
.dot.info{background:var(--info);border-color:var(--info)} .dot.mute{background:var(--mute);border-color:var(--mute)} .dot.touched{border-color:var(--signal)}
.evcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
label.evsel{display:none}
.evh h2{margin:2px 0 6px}
.ios{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.ios ul{margin:4px 0 0;padding-left:20px}
.pick{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ichip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;min-height:36px}
.ichip.on{background:var(--brand2);border-color:var(--brand2);color:var(--on-brand)}
.ichip small{font-weight:700;opacity:.8;margin-right:2px}
.gnote{margin:0;padding:10px 12px;border-left:3px solid var(--info);background:var(--infobg);border-radius:4px;font-size:15px}
.pilots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.pcard.pf{border-top:4px solid var(--brand2)} .pcard.pm{border-top:4px solid var(--mute)}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role{font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--brand2);color:var(--on-brand);border-radius:5px;padding:1px 7px}
.pcard.pm .role{background:var(--mute)}
.reps{display:flex;align-items:center;gap:6px}
.reps b{font-family:var(--f-mono);min-width:18px;text-align:center}
.sts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.st{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 2px;cursor:pointer;font-size:13px;font-weight:700;min-height:42px}
.st.on.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)} .st.on.warn{background:var(--warn);border-color:var(--warn);color:var(--panel)}
.st.on.bad{background:var(--bad);border-color:var(--bad);color:var(--panel)} .st.on.info{background:var(--info);border-color:var(--info);color:var(--panel)}
.st.on.mute{background:var(--mute);border-color:var(--mute);color:var(--panel)}
.dimb{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:600;min-height:38px}
.dimb.on{border-color:var(--brand2);box-shadow:inset 0 -3px 0 var(--brand2)}
.dimb b{background:var(--signal);color:var(--signal-ink);border-radius:999px;padding:0 6px;font-size:12px}
.dimb.need{border-color:var(--bad);color:var(--bad)}
.dims{display:flex;flex-direction:column;gap:6px}
.defpick{display:flex;flex-direction:column;gap:10px;background:var(--panel2);border-radius:8px;padding:10px}
.chips.sel .ichip{background:var(--warnbg);border-color:var(--warnbg);color:var(--warn)}
.aqpgrid{background:var(--aqpbg);border-radius:8px;padding:10px}
.cells{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.cell select{border:1px solid var(--line);border-radius:6px;padding:6px 4px;background:var(--panel);color:var(--muted);font-family:var(--f-mono);font-size:15px;min-width:68px;min-height:40px}
.cell.set select{color:var(--ink);font-weight:700;border-color:var(--aqp)}
.cell.need select{border-color:var(--bad);color:var(--bad)}
p.need{color:var(--bad);margin:6px 0 0}

/* stick diagram */
.stickwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.stick{display:block;min-width:100%}
.sk-line{fill:none;stroke:var(--brand2);stroke-width:2.5;stroke-linejoin:round}
.sk-axis{stroke:var(--line);stroke-width:1}
.sk-tick{stroke:var(--muted);stroke-width:1}
.sk-time{font:600 12px var(--f-mono);fill:var(--muted)}
.sk-cap{position:sticky;left:0;display:flex;justify-content:space-between;gap:12px;padding:10px 14px 0;font-family:var(--f-display);font-size:18px;color:var(--muted)}
.sk-stem{stroke:var(--muted);stroke-width:1;opacity:.55}
.sk-lab{font:600 12px var(--f-body);fill:var(--ink)}
.sk-num{font:700 11px var(--f-mono);fill:var(--muted)}
.sk-ev{cursor:pointer}
.sk-ev:focus{outline:none}
.sk-ev:focus-visible .sk-box{stroke:var(--focus);stroke-width:3}
.sk-box{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
.sk-plane{fill:var(--brand2)}
.sk-box.st-ok{fill:var(--ok);stroke:var(--ok)} .sk-box.st-warn{fill:var(--warn);stroke:var(--warn)} .sk-box.st-bad{fill:var(--bad);stroke:var(--bad)}
.sk-box.st-info{fill:var(--info);stroke:var(--info)} .sk-box.st-mute{fill:var(--mute);stroke:var(--mute)}
.sk-plane.st-ok,.sk-plane.st-warn,.sk-plane.st-bad,.sk-plane.st-info,.sk-plane.st-mute{fill:var(--panel)}
.sk-ev.on .sk-box{stroke:var(--signal);stroke-width:3.5}
.sk-ev.on .sk-lab{font-weight:700;fill:var(--signal)}
.sk-ev.on .sk-stem{stroke:var(--signal);opacity:1;stroke-width:2}
.sk-ev:hover .sk-lab{text-decoration:underline}

.proofbar{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:15px}
/* debrief */
.dcol{display:flex;flex-direction:column;gap:10px}
.tallies{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tl{background:var(--panel2);border-radius:7px;padding:6px 4px;text-align:center;display:flex;flex-direction:column}
.tl b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.tl span{font-size:11px;font-weight:700;color:var(--muted)}
.tl.ok b{color:var(--ok)} .tl.warn b{color:var(--warn)} .tl.bad b{color:var(--bad)} .tl.info b{color:var(--info)}
.tdim{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:4px}
.tdim .ichip{cursor:default;min-height:0;padding:3px 10px}
ul.attn{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
ul.attn li{border-bottom:1px solid var(--line);padding-bottom:8px}
ul.attn p{margin:4px 0 0;font-size:15px}
table.gg td,table.gg th{text-align:center;font-family:var(--f-mono);font-size:13px;width:auto}
table.gg td:first-child{text-align:left;font-family:var(--f-body)}
table.gg td.def{color:var(--muted)} table.gg td.set{font-weight:700;background:var(--aqpbg)} table.gg td.na,table.gg td.unobs{color:var(--line)}
.exports{margin-top:16px}

@media (max-width:860px){
  .runwrap{grid-template-columns:1fr}
  .evlist{display:none}
  label.evsel{display:flex}
  .bhead{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr auto;}
  .srow .scode{grid-column:1/-1}
  .sact{grid-column:1/-1}
  .cur{display:none}
  .sk-cap{max-width:calc(100vw - 34px);font-size:15px}
  .sk-cap .eyebrow{display:none}
}
@media (max-width:520px){
  .sts{grid-template-columns:repeat(3,1fr)}
  .tallies{grid-template-columns:repeat(3,1fr)}
  h2{font-size:26px}
  .ttl .eyebrow{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ================= store: separate N&O data store ================= */
const LOCAL_KEY = "ATLAS_NO_RUNGRADE_SESSIONS_v1";
const store = {mode:"device", db:null, dl:null};
let sessions = {};
let demo = null;
const ui = {view:"home", cur:null, half:0, ev:null, open:{}, del:null};
try { Object.assign(sessions, JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}")); } catch(e){}

const synced = new Set((() => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY + "_synced") || "[]"); } catch(e){ return []; } })());
function saveSynced(){ try { localStorage.setItem(LOCAL_KEY + "_synced", JSON.stringify([...synced])); } catch(e){} }
function cur(){ return ui.cur === "DEMO" ? demo : sessions[ui.cur]; }
function writeLocal(){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(sessions)); } catch(e){} }
const pending = {};
function touch(s){
  if (!s || s.demo) { renderStatus(); return; }
  s.updatedAt = Date.now(); writeLocal();
  clearTimeout(pending[s.id]);
  pending[s.id] = setTimeout(() => pushOne(s.id), 700);
  renderStatus("saving");
}
async function pushOne(id){
  const s = sessions[id]; if (!s) return;
  if (!store.db){ renderStatus(); return; }
  try { await store.db.doc("sessions/" + id).set(clone(s)); synced.add(id); saveSynced(); renderStatus(); }
  catch(e){
    if (e && e.code === "unavailable") setTimeout(() => pushOne(id), 1500 + Math.random()*1000);
    else { toast(e && e.code === "quota_exceeded" ? "The N&O store is full. Export and delete old sessions." : "Couldn't save to the N&O store. Kept on this device."); renderStatus("err"); }
  }
}
async function connectStore(){
  if (!window.claude || !claude.use) return;
  try { store.dl = await claude.use("downloads"); } catch(e){}
  let db = null; if (!PROOF) { try { db = await claude.use("db"); } catch(e){} }
  if (!db) { renderStatus(); return; }
  store.db = db; store.mode = "store";
  let first = true;
  db.collection("sessions").orderBy("updatedAt","desc").limit(500).onSnapshot(snap => {
    const seen = {};
    snap.docs.forEach(d => {
      const r = d.data(); if (!r || r.schema !== SCHEMA) return;
      seen[d.id] = 1;
      const l = sessions[d.id];
      if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) sessions[d.id] = clone(r);
    });
    if (first && !snap.metadata.fromCache) {
      first = false;
      // sessions made on this device before the store connected go up; ones already synced but now gone were deleted elsewhere
      Object.keys(sessions).forEach(id => { if (seen[id]) { if (sessions[id].updatedAt > (snap.docs.find(d=>d.id===id).data().updatedAt||0)) pushOne(id); } else if (synced.has(id)) delete sessions[id]; else pushOne(id); });
    }
    snap.docChanges().forEach(c => { if (c.type === "removed" && !pending[c.doc.id]) delete sessions[c.doc.id]; });
    writeLocal();
    if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { renderStatus(); return; }
    render();
  }, () => { renderStatus("err"); });
  render();
}
async function deleteSession(id){
  delete sessions[id]; writeLocal(); clearTimeout(pending[id]); delete pending[id];
  if (store.db) { try { await store.db.doc("sessions/" + id).delete(); } catch(e){ toast("Removed here; the N&O store could not be reached."); } }
}

function aqpIssues(r, role){

    const g = (r.g || {})[d];
    if (g && /^[123]/.test(g) && !(r.defs || []).some(x => defDim(x) === d)) out.push(d);

}
function pilotRows(s, p){

}

/* ---------- stick diagram (flight profile, like the SPOT / AQP profile pages) ---------- */
const PH_ALT = {Ground:0, Takeoff:0.12, Climb:0.78, "Air work":0.95, Cruise:1, Approach:0.42, Landing:0.06};
function shortLabel(t){
  let x = t.split(" — ")[0].replace(/^Climb & cruise$/,"Climb & cruise").trim();
  if (t.includes(" — ") && /^(Takeoff|ILS|LOC|Non-ILS|Visual|RNAV|Landing|Engine start|Approach)/.test(x)) x += " · " + t.split(" — ")[1];
  return x;
}
function wrapText(t, max){
  const words = t.split(" "), lines = [""];
  words.forEach(w => { const l = lines[lines.length-1]; if ((l + " " + w).trim().length > max && l) lines.push(w); else lines[lines.length-1] = (l + " " + w).trim(); });
  if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].replace(/[ ,·/&-]*$/,"") + "…"; }
  return lines;
}
function stickSVG(s, H, curId, route){
  const n = H.events.length, padL = 26, padR = 26;
  const avail = Math.floor(($("main").clientWidth || 1000) - 2);
  const W = Math.max(700, avail);                       // fits the screen; only narrower than 700 px scrolls
  const step = (W - padL - padR) / n;
  const nt = step < 52 ? 4 : 3;                          // more label rows when events are packed tight
  const fs = step < 46 ? 11 : 12, lh = fs + 1;
  const maxCh = Math.max(10, Math.min(20, Math.floor(step * nt / (fs * 0.62))));
  const tiers = Array.from({length:nt}, (_,k) => 20 + k*40);
  const yTop = tiers[nt-1] + 3*lh + 26, yGnd = yTop + 84, axisY = yGnd + 30, Ht = axisY + 22;
  const pts = H.events.map((e,i) => ({e, i, x: padL + step*(i+0.5), y: yGnd - (PH_ALT[e.ph] ?? 0.5) * (yGnd - yTop)}));
  const line = [`${padL - 14},${yGnd}`, ...pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`), `${W - padR + 14},${yGnd}`].join(" ");
  const ticks = ["0:00","0:30","1:00","1:30","2:00"].map((t,i) => { const x = padL + i*(W-padL-padR)/4;
    return `<line x1="${x}" y1="${axisY-6}" x2="${x}" y2="${axisY}" class="sk-tick"/><text x="${x}" y="${axisY+14}" class="sk-time" text-anchor="${i===0?"start":i===4?"end":"middle"}">${t}</text>`; }).join("");
  const marks = pts.map(p => {
    const r = roleRec(s, ui.half, p.e.id, "pf"), st = r.st ? STBY[r.st].cls : "none";
    const on = p.e.id === curId, ty = tiers[p.i % nt];
    const lines = wrapText(p.e.t.replace(" — "," · "), maxCh);
    const lab = lines.map((l,k) => `<tspan x="${p.x.toFixed(1)}" dy="${k?lh:0}">${esc(l)}</tspan>`).join("");
    const labBottom = ty + (lines.length-1)*lh + 5;
    return `<g class="sk-ev ${on?"on":""}" data-act="ev" data-v="${p.e.id}" role="button" tabindex="0" aria-label="Event ${p.i+1}: ${esc(p.e.t)}">
      <line x1="${p.x.toFixed(1)}" y1="${labBottom}" x2="${p.x.toFixed(1)}" y2="${(p.y-14).toFixed(1)}" class="sk-stem"/>
      <text x="${p.x.toFixed(1)}" y="${ty}" class="sk-lab" text-anchor="middle" style="font-size:${fs}px">${lab}</text>
      <rect x="${(p.x-13).toFixed(1)}" y="${(p.y-13).toFixed(1)}" width="26" height="26" rx="6" class="sk-box st-${st}"/>
      <use href="#sk-plane" x="${(p.x-9).toFixed(1)}" y="${(p.y-9).toFixed(1)}" width="18" height="18" class="sk-plane st-${st}"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y+27).toFixed(1)}" class="sk-num" text-anchor="middle">${p.i+1}</text>
    </g>`;
  }).join("");
  return `<div class="stickwrap" aria-label="Flight profile"><div class="sk-cap"><span class="eyebrow">Flight profile · tap an event</span>${route?`<b>${esc(route)}</b>`:""}</div><svg class="stick" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="group">
    <defs><symbol id="sk-plane" viewBox="0 0 24 24"><path d="M21 15.5v-1.8l-8-5V3.6c0-.9-.7-1.6-1-1.6s-1 .7-1 1.6v5.1l-8 5v1.8l8-2.5v5.2l-2 1.5V21l3-1 3 1v-1.3l-2-1.5V13z"/></symbol></defs>
    <polyline points="${line}" class="sk-line"/>
    <line x1="${padL}" y1="${axisY-6}" x2="${W-padR}" y2="${axisY-6}" class="sk-axis"/>${ticks}
    ${marks}</svg></div>`;
}

/* ---------- debrief ---------- */
function tally(rows){
  const c = {P:0,C:0,N:0,D:0,X:0}, defs = {}; let reps = 0, pf = 0;
  rows.forEach(x => { if (x.r.st) c[x.r.st]++; (x.r.defs||[]).forEach(d => defs[d] = (defs[d]||0)+1); reps += x.r.reps||0; if (x.role==="pf") pf++; });
  return {c, defs, reps, pf};
}
function vDebrief(){
  const s = cur(), L = LESSON(s.lessonId), aqp = s.setup.gradingMode === "aqp";
  const HS = halvesOf(L);
  const col = p => {
    const rows = pilotRows(s, p), t = tally(rows);
    const attn = rows.filter(x => ["C","N"].includes(x.r.st) || (x.r.defs||[]).length || x.r.note);
    const byDim = {}; Object.entries(t.defs).forEach(([d,n]) => { (byDim[defDim(d)] = byDim[defDim(d)] || []).push([d,n]); });
    const dimHtml = Object.keys(DIMS).filter(d => byDim[d]).map(d => `<div class="tdim"><b>${DIMS[d]}</b> ${byDim[d].sort((a,b)=>b[1]-a[1]).map(([k,n]) => `<span class="ichip">${esc(defLabel(k))}${n>1?` ×${n}`:""}</span>`).join("")}</div>`).join("");
    const grid = aqp ? `<div class="scroll"><table class="tbl gg"><thead><tr><th>Event</th><th>Role</th>${["H","SOP","A","CRM"].map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${rows.map(x => `<tr><td>${x.h+1}.${x.i+1} ${esc(x.e.t)}</td><td>${x.role.toUpperCase()}</td>${["H","SOP","A","CRM"].map(d => ROLE_DIMS[x.role].includes(d) ? ((x.r.g||{})[d] ? `<td class="set">${x.r.g[d]}</td>` : x.r.st ? `<td class="def">${x.r.st==="X"?"N/A":"4"}</td>` : `<td class="unobs" title="Not observed">·</td>`) : `<td class="na">—</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : "";
    return `<div class="card dcol"><div class="ph"><span class="role">${p===0?"L":"R"}</span><b>${esc(pilotName(s,p))}</b><span class="muted small">${esc(s.setup.pilots[p].duty)} · PF ${t.pf} events</span></div>
      <div class="tallies">${STATUS.map(x => `<div class="tl ${x.cls}"><b>${t.c[x.k]}</b><span>${x.label}</span></div>`).join("")}<div class="tl"><b>${t.reps}</b><span>Repeats</span></div></div>
      ${dimHtml ? `<h4>Deficiencies</h4>${dimHtml}` : `<p class="muted small">No deficiencies recorded.</p>`}
      <h4>Needs attention &amp; notes</h4>
      ${attn.length ? `<ul class="attn">${attn.map(x => `<li><span class="chip ${x.r.st?STBY[x.r.st].cls:"mute"}">${x.r.st?STBY[x.r.st].label:"—"}</span> <b>${HS.length>1?`${x.h===0?"1st":"2nd"} · `:""}${esc(x.e.t)}</b> <span class="muted small">${x.role.toUpperCase()}${x.r.reps?` · ${x.r.reps} repeats`:""}</span>${x.r.note?`<p>${esc(x.r.note)}</p>`:""}</li>`).join("")}</ul>` : `<p class="muted small">Nothing flagged.</p>`}
      ${grid}
      <div class="g2">
        ${fld(`debrief/p/${p}/overall`,"Training progress",s.debrief.p[p].overall,{type:"select",opts:[["","Select…"],["sat","Satisfactory progress"],["add","Additional training recommended"]]})}
        ${L.kind==="recommend" ? fld(`debrief/p/${p}/rec`,"Proficiency Check",s.debrief.p[p].rec,{type:"select",opts:[["","Select…"],["yes","Recommended for PC"],["no","Not recommended"]]}) : ""}
      </div>
      ${fld(`debrief/p/${p}/study`,"Study items for the next period",s.debrief.p[p].study,{type:"textarea",wide:1})}
      ${fld(`debrief/p/${p}/comments`,"Debrief comments",s.debrief.p[p].comments,{type:"textarea",wide:1})}
    </div>`;
  };
  return `<h2>${esc(L.code)} debrief</h2>
  <p class="muted">One-hour debrief: review performance, then set study items for the next period.</p>
  <div class="g2 cols">${col(0)}${col(1)}</div>
  ${refDrawer("dprompt","Debriefing & analysis prompts", `<ul>${CRM_TEM[CRM_TEM.length-1][1].map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`)}
  ${fld("debrief/crew","Crew debrief notes",s.debrief.crew,{type:"textarea",wide:1})}
  <div class="card"><div class="g3">
    ${fld("debrief/signedBy","Instructor",s.debrief.signedBy || s.setup.instructor)}
    ${fld("debrief/signedAt","Date",s.debrief.signedAt || s.setup.date,{type:"date"})}
    <div class="f"><span>Session</span>${s.status==="complete" ? `<button class="btn" data-act="reopen">Reopen session</button>` : `<button class="btn primary" data-act="complete">Mark complete</button>`}</div>
  </div></div>
  <div class="card exports"><span class="eyebrow">Export</span>
    <div class="row"><button class="btn" data-act="exp" data-v="html">Debrief sheet (.html)</button>
    <button class="btn" data-act="exp" data-v="csv">Event data (.csv)</button>
    <button class="btn" data-act="exp" data-v="json">Full record (.json)</button></div>
    <p class="muted small">The record carries program “N&amp;O”, the lesson source and every event id, so it can be loaded into AQP tooling later.</p></div>`;
}

/* ---------- exports ---------- */
function exportCSV(s){
  const L = LESSON(s.lessonId), HS = halvesOf(L);
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const out = [["program","session","lesson","date","half","event_id","seq","event","pilot","emp","role","status","repeats","H","SOP","A","CRM","deficiencies","note","crew_note","malfunctions"].join(",")];
  HS.forEach((H,h) => H.events.forEach((e,i) => {
    const er = evRec(s,h,e.id);
    ["pf","pm"].forEach(role => {
      const pi = role==="pf" ? pfIndex(s,h) : 1-pfIndex(s,h), r = er[role] || {};
      const g = d => ROLE_DIMS[role].includes(d) ? ((r.g||{})[d] || (r.st ? (r.st==="X"?"N/A":"4") : "")) : "";
      out.push([ "N&O", s.id, L.code, s.setup.date, h+1, e.id, i+1, e.t, pilotName(s,pi), s.setup.pilots[pi].emp, role.toUpperCase(),
        r.st ? STBY[r.st].label : "", r.reps||0, g("H"), g("SOP"), g("A"), g("CRM"), (r.defs||[]).join("; "), r.note||"", er.crew||"", Object.values(er.pick||{}).join("; ") ].map(q).join(","));
    });
  }));
  return out.join("\n");
}
function exportHTML(s){
  const L = LESSON(s.lessonId), HS = halvesOf(L), aqp = s.setup.gradingMode === "aqp";
  const lab = {sat:"Satisfactory progress", add:"Additional training recommended", yes:"Recommended for PC", no:"Not recommended"};
  const pil = p => { const rows = pilotRows(s,p), t = tally(rows);
    return `<section><h2>${esc(pilotName(s,p))} <small>${esc(s.setup.pilots[p].duty)} · emp ${esc(s.setup.pilots[p].emp)}</small></h2>
    <p>${STATUS.map(x=>`${x.label}: ${t.c[x.k]}`).join(" · ")} · Repeats: ${t.reps}</p>
    <table><thead><tr><th>#</th><th>Event</th><th>Role</th><th>Status</th>${aqp?"<th>H</th><th>SOP</th><th>A</th><th>CRM</th>":""}<th>Deficiencies</th><th>Note</th></tr></thead><tbody>
    ${rows.map(x => `<tr><td>${x.h+1}.${x.i+1}</td><td>${esc(x.e.t)}</td><td>${x.role.toUpperCase()}</td><td>${x.r.st?STBY[x.r.st].label:""}${x.r.reps?` (${x.r.reps}×)`:""}</td>${aqp?["H","SOP","A","CRM"].map(d=>`<td>${ROLE_DIMS[x.role].includes(d)?((x.r.g||{})[d]||(x.r.st?(x.r.st==="X"?"N/A":"4"):"")):"—"}</td>`).join(""):""}<td>${(x.r.defs||[]).map(d=>esc(`${defDim(d)}: ${defLabel(d)}`)).join("<br>")}</td><td>${esc(x.r.note||"")}</td></tr>`).join("")}
    </tbody></table>
    <p><b>Training progress:</b> ${esc(lab[s.debrief.p[p].overall]||"—")}${L.kind==="recommend"?` · <b>PC:</b> ${esc(lab[s.debrief.p[p].rec]||"—")}`:""}</p>
    <p><b>Study items:</b> ${esc(s.debrief.p[p].study||"—")}</p><p><b>Comments:</b> ${esc(s.debrief.p[p].comments||"—")}</p></section>`; };
  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(L.code)} debrief ${esc(s.setup.date)}</title>
<style>body{font:13px/1.45 -apple-system,Segoe UI,Arial,sans-serif;color:#14201f;margin:24px}h1{font-size:20px;margin:0}h2{font-size:16px;border-bottom:2px solid #0d4a4f;padding-bottom:3px;margin-top:22px}small{color:#5a6968;font-weight:400}table{border-collapse:collapse;width:100%}th,td{border:1px solid #c9d3d1;padding:4px 6px;text-align:left;vertical-align:top}th{background:#e6eeec}.hdr{display:flex;justify-content:space-between;border-bottom:4px solid #e07a1f;padding-bottom:8px}.tag{background:#0d4a4f;color:#fff;padding:2px 8px;border-radius:4px;font-weight:700}@media print{body{margin:10mm}}</style></head><body>
<div class="hdr"><div><span class="tag">N&amp;O</span> <h1 style="display:inline">${esc(L.code)} — ${esc(L.name)}</h1><br><small>${esc(L.src)} · ${esc(s.setup.trainingType)} · ${esc(s.setup.date)} · ${esc(s.setup.device)}</small></div>
<div><small>Instructor</small><br><b>${esc(s.debrief.signedBy||s.setup.instructor)}</b> ${esc(s.setup.instrEmp)}<br><small>${aqp?"AQP grading preview":"Training record — not an AQP grade"}</small></div></div>
${pil(0)}${pil(1)}
<h2>Brief</h2><p>${esc(s.brief.notes||"—")}</p><h2>Crew debrief</h2><p>${esc(s.debrief.crew||"—")}</p>
<p><small>Session ${esc(s.id)} · ${HS.length} halves · generated ${new Date().toLocaleString()}</small></p></body></html>`;
}
async function doExport(kind){
  const s = cur(); const L = LESSON(s.lessonId);
  const base = `NO_${L.code.replace(/\s+/g,"")}_${s.setup.date}_${(pilotName(s,0)).replace(/\W+/g,"")}`;
  const files = {json:[base+".json", JSON.stringify(s,null,2)], csv:[base+".csv", exportCSV(s)], html:[base+"_debrief.html", exportHTML(s)]};
  if (!store.dl) {
    if (!window.claude) { // standalone file outside Claude: plain browser download
      const types = {json:"application/json", csv:"text/csv", html:"text/html"};
      const url = URL.createObjectURL(new Blob([files[kind][1]], {type:types[kind]}));
      const a = document.createElement("a"); a.href = url; a.download = files[kind][0]; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Exported"); return;
    }
    toast("File export isn't available in this view."); return; }
  try { await store.dl.save({filename:files[kind][0], data:files[kind][1]}); toast("Exported"); }
  catch(e){ if (e && e.code !== "declined") toast("Export failed: " + (e.message || e.code)); }
}

/* ================= timers ================= */
function tickTimers(){
  const s = cur(); if (!s) return;
  if (ui.view === "brief" && $("briefClock")) { const el = s.brief.elapsed + (s.brief.startedAt ? Date.now()-s.brief.startedAt : 0); $("briefClock").textContent = fmtDur(el); $("briefBar").style.width = Math.min(100, el/72000) + "%"; }
  if (ui.view === "run" && $("simClock")) { const h = s.halves[ui.half]; $("simClock").textContent = fmtDur(h.elapsed + (h.startedAt ? Date.now()-h.startedAt : 0)); }
}
function toggleTimer(o){ if (o.startedAt){ o.elapsed += Date.now() - o.startedAt; o.startedAt = null; } else o.startedAt = Date.now(); }

/* ================= events ================= */
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2800); }
function applyTheme(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem("NO_RG_THEME")); } catch(e){}

document.addEventListener("input", ev => {
  const t = ev.target, k = t.dataset.k; if (!k || t.tagName === "SELECT") return;
  const s = cur(); if (!s) return;
  setPath(s, k, t.value); touch(s);
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.actChange === "evsel") { ui.ev = t.value; render(); window.scrollTo({top:0}); return; }
  const k = t.dataset.k; if (!k || t.tagName !== "SELECT") return;
  const s = cur(); if (!s) return;
  if (k === "lessonId") { s.lessonId = t.value; s.lessonSource = LESSON(t.value).src; ui.ev = null; }
  else setPath(s, k, t.value);
  touch(s); render();
});
document.addEventListener("keydown", ev => { const g = ev.target.closest && ev.target.closest(".sk-ev"); if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); g.dispatchEvent(new MouseEvent("click", {bubbles:true})); } });
document.addEventListener("toggle", ev => { const d = ev.target; if (d.dataset && d.dataset.open) ui.open[d.dataset.open] = d.open; }, true);

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v, s = cur();
  if (a !== "del") ui.del = null;
  switch(a){
    case "theme": {
      const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      const t = dark ? "light" : "dark"; applyTheme(t); try { localStorage.setItem("NO_RG_THEME", t); } catch(e){} return;
    }
    case "view": ui.view = v; window.scrollTo({top:0}); break;
    case "start": { const n = newSession(v); sessions[n.id] = n; ui.cur = n.id; ui.view = "setup"; ui.half = 0; ui.ev = null; touch(n); break; }
    case "sample": demo = sampleSession(); ui.cur = "DEMO"; ui.view = "run"; ui.half = 0; ui.ev = LESSON("FFSU4.2").events[3].id; break;
    case "open": ui.cur = v; ui.view = sessions[v].status === "complete" ? "debrief" : "run"; ui.half = 0; ui.ev = null; break;
    case "del": if (ui.del === v) { deleteSession(v); ui.del = null; if (ui.cur === v) ui.cur = null; toast("Session deleted"); } else { ui.del = v; setTimeout(() => { if (ui.del === v) { ui.del = null; render(); } }, 3500); } break;
    case "mode": s.setup.gradingMode = v; touch(s); break;
    case "bchk": s.brief.checked[v] = s.brief.checked[v] ? 0 : 1; touch(s); break;
    case "btimer": toggleTimer(s.brief); touch(s); break;
    case "stimer": toggleTimer(s.halves[ui.half]); touch(s); break;
    case "half": ui.half = +v; ui.ev = null; window.scrollTo({top:0}); break;
    case "ev": ui.ev = v; if (matchMedia("(max-width: 860px)").matches) window.scrollTo({top:0}); break;
    case "step": { const H = halvesOf(LESSON(s.lessonId))[ui.half]; const i = H.events.findIndex(e => e.id === ui.ev) + +v; if (H.events[i]) ui.ev = H.events[i].id; window.scrollTo({top:0, behavior:"smooth"}); break; }
    case "req": { const er = evRec(s, ui.half, ui.ev, true); er.req = er.req || {}; er.req[v] = er.req[v] ? 0 : 1; touch(s); break; }
    case "pick": { const er = evRec(s, ui.half, ui.ev, true); er.pick = er.pick || {}; er.pick[b.dataset.g] = er.pick[b.dataset.g] === v ? "" : v; touch(s); break; }
    case "st": { const er = evRec(s, ui.half, ui.ev, true); const r = er[b.dataset.r] = er[b.dataset.r] || {}; r.st = r.st === v ? "" : v; touch(s); break; }
    case "reps": { const er = evRec(s, ui.half, ui.ev, true); const r = er.pf = er.pf || {}; r.reps = Math.max(0, (r.reps||0) + +v); touch(s); break; }
    case "dim": ui.open[b.dataset.k] = ui.open[b.dataset.k] === v ? null : v; break;
    case "def": { const er = evRec(s, ui.half, ui.ev, true); const r = er[b.dataset.r] = er[b.dataset.r] || {}; r.defs = r.defs || [];
      r.defs = r.defs.includes(v) ? r.defs.filter(x => x !== v) : [...r.defs, v]; touch(s); break; }
    case "complete": s.status = "complete"; if (!s.debrief.signedBy) s.debrief.signedBy = s.setup.instructor; if (!s.debrief.signedAt) s.debrief.signedAt = s.setup.date; touch(s); toast("Session marked complete"); break;
    case "reopen": s.status = "open"; touch(s); break;
    case "exp": doExport(v); return;
    default: return;
  }
  const y = window.scrollY; render();
  if (!["view","half","step","start","sample","open"].includes(a)) window.scrollTo({top:y});
});

let rsz; let lastW = 0;
window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => {
  const w = $("main").clientWidth; if (ui.view === "run" && Math.abs(w - lastW) > 8 && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) { lastW = w; const y = window.scrollY; render(); window.scrollTo({top:y}); }
}, 150); });
render();
lastW = $("main").clientWidth;
connectStore();

</script>

</body></html>
